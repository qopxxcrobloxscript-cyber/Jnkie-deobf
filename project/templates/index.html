<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JNKIE Loader — URL Probe</title>
<style>
  :root {
    --bg-0: #0a0b14;
    --bg-1: #10121f;
    --accent: #7c5cff;
    --accent-2: #00e5ff;
    --ok: #35e08a;
    --err: #ff5470;
    --text: #e7e9f5;
    --muted: #8b90a8;
    --border: rgba(255,255,255,0.08);
    --glow: 0 0 24px rgba(124,92,255,0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(124,92,255,0.25), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(0,229,255,0.15), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color: var(--text);
    font-family: "Inter", "Segoe UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 40px;
    gap: 24px;
  }

  .title {
    text-align: center;
  }
  .title h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 0.08em;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(124,92,255,0.35);
  }
  .title p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.05em;
  }

  .run-btn {
    position: relative;
    padding: 16px 56px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #4a2dff);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: var(--glow), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform .15s ease, box-shadow .25s ease, filter .2s ease;
    text-transform: uppercase;
  }
  .run-btn::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent));
    opacity: 0.55;
    filter: blur(14px);
    z-index: -1;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .run-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 36px rgba(124,92,255,0.7), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .run-btn:active { transform: translateY(0) scale(0.98); }
  .run-btn:disabled {
    filter: grayscale(0.4) brightness(0.8);
    cursor: not-allowed;
    transform: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 0.85; }
  }

  .log-panel {
    width: 100%;
    max-width: 900px;
    background: rgba(16, 18, 31, 0.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.05);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .log-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
  }
  .dot.red    { background: #ff5f57; color: #ff5f57; }
  .dot.yellow { background: #febc2e; color: #febc2e; }
  .dot.green  { background: #28c840; color: #28c840; }

  .log-header .label {
    margin-left: 8px;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .log-body {
    height: 480px;
    overflow-y: auto;
    padding: 16px 20px 24px;
    font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace;
    font-size: 13px;
    line-height: 1.65;
    scroll-behavior: smooth;
  }
  .log-body::-webkit-scrollbar { width: 8px; }
  .log-body::-webkit-scrollbar-track { background: transparent; }
  .log-body::-webkit-scrollbar-thumb {
    background: rgba(124,92,255,0.35);
    border-radius: 8px;
  }
  .log-body::-webkit-scrollbar-thumb:hover {
    background: rgba(124,92,255,0.6);
  }

  .line {
    display: block;
    white-space: pre-wrap;
    word-break: break-all;
    padding: 2px 0;
    animation: fadeIn .25s ease;
  }
  .line .ts {
    color: var(--muted);
    margin-right: 10px;
    user-select: none;
  }
  .line.info  { color: var(--text); }
  .line.ok    { color: var(--ok); }
  .line.err   { color: var(--err); }
  .line.url   {
    color: var(--accent-2);
    background: rgba(0,229,255,0.06);
    border-left: 3px solid var(--accent-2);
    padding: 6px 10px;
    margin: 6px 0;
    border-radius: 6px;
    user-select: all;
    cursor: text;
  }
  .line.hash {
    color: #c9b6ff;
    background: rgba(124,92,255,0.08);
    border-left: 3px solid var(--accent);
    padding: 6px 10px;
    margin: 6px 0;
    border-radius: 6px;
    user-select: all;
    cursor: text;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .footer {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.1em;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">
      <h1>JNKIE LOADER</h1>
      <p>SCRIPT DELIVERY PROBE — URL INSPECTOR</p>
    </div>

    <button id="runBtn" class="run-btn">EXECUTE</button>

    <div class="log-panel">
      <div class="log-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="label">console output</span>
      </div>
      <div id="log" class="log-body"></div>
    </div>

    <div class="footer">© JNKIE PROBE — for authorized use only</div>
  </div>

<script>
  // サーバーからトークンを注入（後述の server.py 側で置換）
  const CLIENT_TOKEN = "{{ client_token }}";

  const logEl   = document.getElementById("log");
  const runBtn  = document.getElementById("runBtn");

  function ts() {
    const d = new Date();
    const pad = (n, l = 2) => String(n).padStart(l, "0");
    return `[${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(),3)}]`;
  }

  function log(msg, cls = "info") {
    const line = document.createElement("span");
    line.className = `line ${cls}`;
    const t = document.createElement("span");
    t.className = "ts";
    t.textContent = ts();
    line.appendChild(t);
    line.appendChild(document.createTextNode(msg));
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function run() {
    runBtn.disabled = true;
    logEl.innerHTML = "";
    log("▶ 認証APIへリクエストを送信中...", "info");

    const t0 = performance.now();
    try {
      const res = await fetch("/info", {
        headers: { "X-Client-Token": CLIENT_TOKEN }
      });

      const dt = (performance.now() - t0).toFixed(0);

      if (!res.ok) {
        const txt = await res.text();
        log(`✖ HTTP ${res.status} (${dt}ms)`, "err");
        log(txt, "err");
        return;
      }

      const data = await res.json();
      log(`✔ 認証成功 (${dt}ms)`, "ok");
      log("──────── 本体スクリプト情報 ────────", "info");
      log(data.url, "url");
      log(`length : ${data.length} bytes`, "info");
      log(`sha256 : ${data.sha256}`, "hash");
      log("──────────────────────────────────", "info");
      log("ℹ URLはクリックで選択できます（ダブルクリックで全選択）", "info");
    } catch (e) {
      log(`✖ 通信エラー: ${e.message}`, "err");
    } finally {
      runBtn.disabled = false;
    }
  }

  runBtn.addEventListener("click", run);

  // 起動時の案内
  log("JNKIE Loader URL Probe ready.", "info");
  log("EXECUTE を押すと本体スクリプトのURLを取得します。", "info");
</script>
</body>
</html>
